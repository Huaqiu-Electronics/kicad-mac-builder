name: KiCad client packaging

on:
  release:
    branches: [master]
    types: [published]
  workflow_dispatch:

# ---------------------------------------------------------------------------
# Split packaging (docs/split-packaging.md)
#
# ARM64 and x86_64 are built as INDEPENDENT GitHub Actions matrix jobs that
# run in parallel on separate Apple Silicon (macos-14) runners. Each job
# bootstraps, builds ONLY its own architecture, produces an
# architecture-specific DMG, and — immediately when its build finishes —
# uploads that DMG directly to the GitHub release.
#
# There is NO universal binary, NO lipo step, NO universal DMG, and NO
# blocking publish-release job that waits for both architectures. The two
# jobs do NOT depend on each other (fail-fast: false); each uploads its
# own DMG asset the moment it's ready.
# ---------------------------------------------------------------------------

jobs:
  build:
    runs-on: macos-14   # macOS 14 / Xcode 16.2 baseline (do not switch for this task)
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both jobs run on Apple Silicon runners. The x86_64 build uses
          # Rosetta 2 and the /usr/local Homebrew installation, exactly like
          # ci/x86_64-on-arm64/bootstrap-x86_64-on-arm64.sh.
          - arch: arm64
            bootstrap_script: ./ci/arm64-on-arm64/bootstrap-arm64-on-arm64.sh
          - arch: x86_64
            bootstrap_script: ./ci/x86_64-on-arm64/bootstrap-x86_64-on-arm64.sh

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show initial disk usage
        run: |
          echo "Initial disk usage:"
          df -h

      - name: Free disk spaces (keep Xcode 16.2)
        run: |
          echo "Cleaning large preinstalled software..."

          # The Xcode version to keep
          KEEP_XCODE="/Applications/Xcode_16.2.app"
          KEEP_SYMLINK="/Applications/Xcode.app"

          # Remove all other Xcodes
          for xcode in /Applications/Xcode*.app; do
            if [ "$xcode" != "$KEEP_XCODE" ] && [ "$xcode" != "$KEEP_SYMLINK" ]; then
              echo "Removing $xcode ..."
              sudo rm -rf "$xcode"
            fi
          done

          # Optional: remove old simulators and user Xcode caches
          sudo rm -rf /Library/Developer/CoreSimulator || true
          sudo rm -rf ~/Library/Developer/Xcode || true

          # Ensure Xcode selection points to the version we want
          sudo xcode-select -s "$KEEP_XCODE"

          echo "Selected Xcode version:"
          xcodebuild -version
          clang++ --version

          # Remove Android SDK
          sudo rm -rf /Users/runner/Library/Android || true

          # Cleanup Homebrew caches
          brew cleanup -s || true
          rm -rf "$(brew --cache)" || true

          echo "Disk after cleanup:"
          df -h

      - name: Get latest tag
        id: latest-release
        uses: oprypin/find-latest-tag@v1
        with:
          repository: Huaqiu-Electronics/kicad-mac-builder
          releases-only: true

      - name: Install build tools
        run: |
          brew update
          brew install ccache ninja

      - name: Setup ccache
        run: |
          echo 'export CC="ccache clang"' >> $GITHUB_ENV
          echo 'export CXX="ccache clang++"' >> $GITHUB_ENV

      # Architecture-specific ccache key so ARM64 and x86_64 compiler caches
      # never collide (docs/split-packaging.md section 9).
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: macos-ccache-${{ matrix.arch }}-${{ github.ref }}
          restore-keys: |
            macos-ccache-${{ matrix.arch }}-

      - name: Identify architecture
        run: |
          echo "============================================================"
          echo "Build matrix architecture: ${{ matrix.arch }}"
          echo "============================================================"
          uname -m
          arch

      - name: Bootstrap (${{ matrix.arch }})
        run: ${{ matrix.bootstrap_script }}

      - name: Show disk before build
        run: df -h

      - name: Build KiCad (${{ matrix.arch }})
        env:
          TAG: ${{ steps.latest-release.outputs.tag }}
          KICAD_REF: release/10.0
          EXTRA_VERSION: -huaqiu
          RELEASE_ARG: --release
          SYMBOLS_REF: ${{ steps.latest-release.outputs.tag }}
          FOOTPRINTS_REF: ${{ steps.latest-release.outputs.tag }}
          PACKAGES3D_REF: ${{ steps.latest-release.outputs.tag }}
          TEMPLATES_REF: ${{ steps.latest-release.outputs.tag }}
          # RELEASE_NAME includes the architecture so the two jobs never
          # produce ambiguous output names (section 10). package.sh names the
          # DMG kicad-unified-${RELEASE_NAME}.dmg; the rename step below
          # strips "unified-" to match section 7's required asset names.
          RELEASE_NAME: huaqiu-${{ steps.latest-release.outputs.tag }}-macos-${{ matrix.arch }}
          DOCS_TARBALL_URL: https://gitlab.com/kicad/services/kicad-doc/-/archive/${{ steps.latest-release.outputs.tag }}/kicad-doc-${{ steps.latest-release.outputs.tag }}.tar.gz
        run: |
          ./ci/src/make-build-with-refs.sh --arch ${{ matrix.arch }}

      - name: Show DMG files
        run: |
          echo "Listing DMG files:"
          find . -name "*.dmg"

      - name: Show disk after build
        run: df -h

      - name: Rename DMG to release asset name
        env:
          RELEASE_NAME: huaqiu-${{ steps.latest-release.outputs.tag }}-macos-${{ matrix.arch }}
        id: rename-dmg
        run: |
          # package.sh produces build/dmg/kicad-unified-${RELEASE_NAME}.dmg.
          # The release must contain kicad-${RELEASE_NAME}.dmg (no "unified",
          # per docs/split-packaging.md section 7).
          SRC="$(find build/dmg -name 'kicad-unified-*.dmg' | head -n1)"
          if [ -z "$SRC" ]; then
            echo "ERROR: no kicad-unified-*.dmg found in build/dmg/"
            ls -la build/dmg/ || true
            exit 1
          fi
          DST="build/dmg/kicad-${RELEASE_NAME}.dmg"
          echo "Renaming:"
          echo "  $SRC"
          echo "  -> $DST"
          mv "$SRC" "$DST"
          echo "Verifying architecture of the packaged binary:"
          # Mount the DMG read-only and inspect KiCad's Mach-O architecture.
          MNT="$(mktemp -d /tmp/kicad-dmg.XXXXXX)"
          hdiutil attach "$DST" -mountpoint "$MNT" -nobrowse -readonly -noautoopen
          BIN="$(find "$MNT" -path '*/MacOS/kicad' -type f | head -n1)"
          if [ -n "$BIN" ]; then
            echo "file output for $BIN:"
            file "$BIN"
          else
            echo "Note: kicad binary not found inside DMG to inspect."
          fi
          hdiutil detach "$(hdiutil info | grep -A1 "$MNT" | grep '^/dev/' | awk '{print $1}')" -force || true
          echo "dmg_path=$DST" >> "$GITHUB_OUTPUT"

      # Artifact upload is kept as a backup (for debugging / archival). It
      # runs AFTER the rename step but BEFORE the release upload so that
      # a network hiccup during release upload doesn't lose the artifact.
      - name: Upload DMG artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: kicad-dmg-${{ matrix.arch }}
          path: build/dmg/kicad-*.dmg
          if-no-files-found: error
          retention-days: 7

      # -------------------------------------------------------------------
      # Direct, immediate release upload — per architecture, as soon as
      # THIS matrix job's build & rename succeed. No waiting for the OTHER
      # architecture's matrix job. Each upload targets a different asset
      # name (arm64 vs x86_64) so there is no race / overwrite risk.
      # -------------------------------------------------------------------
      - name: Upload ${{ matrix.arch }} DMG to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.HUAQIU_ELECTRONICS_TOKEN }}
          file: ${{ steps.rename-dmg.outputs.dmg_path }}
          asset_name: kicad-huaqiu-${{ steps.latest-release.outputs.tag }}-macos-${{ matrix.arch }}.dmg
          overwrite: true
          tag: ${{ steps.latest-release.outputs.tag }}
